[workspace]
members = [
  "crates/wdog-core",
  "crates/usb-watchdogd",
  "crates/wdog-recover",
  "crates/usb-watchdogctl",
  "crates/wdog-panel",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
wdog-core = { path = "crates/wdog-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
